name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Tests
        run: build\Release\zs_tests.exe
      - name: Benchmark (PC proxy)
        run: build\Release\zs_tool.exe --bench
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/ZombieSettlement | Out-Null
          Copy-Item build/Release/ZombieSettlement.exe dist/ZombieSettlement/
          Copy-Item README.md, LICENSE, docs/FBI_INSTALLATION.md dist/ZombieSettlement/
          Compress-Archive -Path dist/ZombieSettlement/* -DestinationPath dist/ZombieSettlement-Windows.zip -Force
          if ((Get-Item dist/ZombieSettlement-Windows.zip).Length -lt 100000) { throw "package too small" }
      - name: Smoke test packaged exe outside the build dir
        shell: pwsh
        run: |
          Expand-Archive dist/ZombieSettlement-Windows.zip -DestinationPath $env:RUNNER_TEMP/zs -Force
          $p = Start-Process -FilePath "$env:RUNNER_TEMP/zs/ZombieSettlement.exe" -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { throw "game exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: ZombieSettlement-Windows
          path: dist/ZombieSettlement-Windows.zip
  n3ds-build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .3dsx
        run: make -j4
      - name: Check 3DSX magic
        run: head -c 4 ZombieSettlement.3dsx | grep -q 3DSX
      - uses: actions/upload-artifact@v4
        with:
          name: n3ds-elf
          path: |
            ZombieSettlement.elf
            ZombieSettlement.3dsx
  n3ds-package:
    # makerom needs glibc >= 2.38, newer than the devkitPro container: package on the host runner
    needs: n3ds-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: n3ds-elf
      - name: Packaging tools (makerom, bannertool)
        run: |
          curl -fsSL -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          curl -fsSL -o bannertool.zip https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip
          unzip -o -q makerom.zip -d tools-bin && unzip -o -q bannertool.zip -d bannertool
          cp bannertool/linux-x86_64/bannertool tools-bin/ && chmod +x tools-bin/*
      - name: Build .cia
        run: sh scripts/package_3ds.sh tools-bin
      - name: Verify outputs
        run: |
          set -e
          for f in dist/ZombieSettlement-3DS.3dsx dist/ZombieSettlement-3DS.cia; do test -s "$f" || { echo "missing $f"; exit 1; }; done
          head -c 4 dist/ZombieSettlement-3DS.3dsx | grep -q 3DSX
          test "$(od -An -tx1 -N4 dist/ZombieSettlement-3DS.cia | tr -d ' \n')" = "20200000"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ZombieSettlement-3DS
          path: dist/
  publish:
    needs: [windows, n3ds-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Collect assets
        run: |
          set -e
          mkdir out
          cp art/ZombieSettlement-Windows/ZombieSettlement-Windows.zip out/
          cp art/ZombieSettlement-3DS/ZombieSettlement-3DS.3dsx art/ZombieSettlement-3DS/ZombieSettlement-3DS.cia out/
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Create release
        run: |
          sed -n "/^## $TAG/,/^## v/p" CHANGELOG.md | sed '$d' > notes.md || true
          printf '\n## Install\n- Windows: unzip and run ZombieSettlement.exe\n- 3DS Homebrew Launcher: copy the .3dsx to sdmc:/3ds/\n- 3DS HOME Menu: install the .cia with FBI (scan ZombieSettlement-FBI-QR.png via Remote Install > Scan QR Code). See docs/FBI_INSTALLATION.md.\n\nHardware status: the 3DS build has been booted in the Azahar emulator only; real-hardware and QR installs are not yet verified.\n' >> notes.md
          gh release create "$TAG" out/* --title "Zombie Settlement $TAG" --notes-file notes.md
      - name: Verify public CIA download, then build the FBI QR code
        run: |
          set -e
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/ZombieSettlement-3DS.cia"
          curl -fsSL -o check.cia "$URL"
          cmp check.cia out/ZombieSettlement-3DS.cia
          sudo apt-get install -y -qq qrencode > /dev/null
          qrencode -s 8 -m 2 -o ZombieSettlement-FBI-QR.png "$URL"
          gh release upload "$TAG" ZombieSettlement-FBI-QR.png
          echo "QR -> $URL"
