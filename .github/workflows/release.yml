name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    uses: ./.github/workflows/windows.yml
  n3ds:
    uses: ./.github/workflows/3ds.yml
  publish:
    needs: [windows, n3ds]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Collect assets
        run: |
          set -e
          mkdir out
          cp art/ZombieSettlement-Windows/ZombieSettlement-Windows.zip out/
          cp art/ZombieSettlement-3DS/ZombieSettlement-3DS.3dsx art/ZombieSettlement-3DS/ZombieSettlement-3DS.cia out/
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Create release
        run: |
          sed -n "/^## $TAG/,/^## v/p" CHANGELOG.md | sed '$d' > notes.md || true
          printf '\n## Install\n- Windows: unzip and run ZombieSettlement.exe\n- 3DS Homebrew Launcher: copy the .3dsx to sdmc:/3ds/\n- 3DS HOME Menu: install the .cia with FBI (scan ZombieSettlement-FBI-QR.png via Remote Install > Scan QR Code). See docs/FBI_INSTALLATION.md.\n\nHardware status: the 3DS build has been booted in the Azahar emulator only; real-hardware and QR installs are not yet verified.\n' >> notes.md
          gh release create "$TAG" out/* --title "Zombie Settlement $TAG" --notes-file notes.md
      - name: Verify public CIA download, then build the FBI QR code
        run: |
          set -e
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/ZombieSettlement-3DS.cia"
          curl -fsSL -o check.cia "$URL"
          cmp check.cia out/ZombieSettlement-3DS.cia
          sudo apt-get install -y -qq qrencode > /dev/null
          qrencode -s 8 -m 2 -o ZombieSettlement-FBI-QR.png "$URL"
          gh release upload "$TAG" ZombieSettlement-FBI-QR.png
          echo "QR -> $URL"
